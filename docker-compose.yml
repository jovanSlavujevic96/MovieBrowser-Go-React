services:
  backend:
    build:
      context: ./backend
    command: tail -f /dev/null
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    command: tail -f /dev/null
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
